<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%" fill="none">
  <!-- Wayfarer Iconic Trapezoid Frame -->
  <defs>
    <linearGradient id="way-demi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="30%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#271005"/>
      <stop offset="100%" stop-color="#552207"/>
    </linearGradient>
    <linearGradient id="way-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Left Temple Extension -->
  <path d="M 28 42 L 6 39 C 4 39 2 41 2 44 L 2 54 C 2 57 4 59 6 59 L 28 56 Z" fill="url(#way-demi)"/>
  <!-- Right Temple Extension -->
  <path d="M 372 42 L 394 39 C 396 39 398 41 398 44 L 398 54 C 398 57 396 59 394 59 L 372 56 Z" fill="url(#way-demi)"/>

  <!-- Left Trapezoid Lens -->
  <path d="M 34 38 L 176 44 C 178 78 162 122 122 124 C 78 124 44 98 34 38 Z" fill="url(#way-lens)"/>
  <path d="M 34 38 L 176 44 C 178 78 162 122 122 124 C 78 124 44 98 34 38 Z" stroke="url(#way-demi)" stroke-width="8" stroke-linejoin="round"/>
  <!-- Glare -->
  <path d="M 52 42 L 105 42 L 72 118 L 54 118 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Bridge -->
  <path d="M 176 54 C 188 48 212 48 224 54" stroke="url(#way-demi)" stroke-width="8" stroke-linecap="round"/>

  <!-- Right Trapezoid Lens -->
  <path d="M 366 38 L 224 44 C 222 78 238 122 278 124 C 322 124 356 98 366 38 Z" fill="url(#way-lens)"/>
  <path d="M 366 38 L 224 44 C 222 78 238 122 278 124 C 322 124 356 98 366 38 Z" stroke="url(#way-demi)" stroke-width="8" stroke-linejoin="round"/>
  <!-- Glare -->
  <path d="M 252 42 L 305 42 L 272 118 L 254 118 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Silver Front Horizontal Oval Rivets -->
  <ellipse cx="28" cy="46" rx="3.5" ry="1.8" fill="#e2e8f0"/>
  <ellipse cx="372" cy="46" rx="3.5" ry="1.8" fill="#e2e8f0"/>
</svg>
