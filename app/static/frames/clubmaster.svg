<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%" fill="none">
  <!-- Clubmaster Browline Frame -->
  <defs>
    <linearGradient id="clb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="clb-brow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="clb-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Left Lower Wire Rim & Glass -->
  <path d="M 46 56 C 46 95 65 124 110 124 C 150 124 174 95 174 56 Z" fill="url(#clb-lens)"/>
  <path d="M 46 56 C 46 95 65 124 110 124 C 150 124 174 95 174 56" stroke="url(#clb-gold)" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Glare -->
  <path d="M 68 56 L 105 56 L 85 118 L 68 118 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Left Bold Acetate Brow -->
  <path d="M 32 46 C 70 38 135 38 180 48 L 176 60 C 135 52 70 52 42 58 Z" fill="url(#clb-brow)"/>
  <circle cx="38" cy="49" r="2" fill="url(#clb-gold)"/>

  <!-- Golden Center Bridge -->
  <path d="M 174 54 C 184 46 216 46 226 54" stroke="url(#clb-gold)" stroke-width="5" stroke-linecap="round"/>

  <!-- Right Lower Wire Rim & Glass -->
  <path d="M 226 56 C 226 95 250 124 290 124 C 335 124 354 95 354 56 Z" fill="url(#clb-lens)"/>
  <path d="M 226 56 C 226 95 250 124 290 124 C 335 124 354 95 354 56" stroke="url(#clb-gold)" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Glare -->
  <path d="M 248 56 L 285 56 L 265 118 L 248 118 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Right Bold Acetate Brow -->
  <path d="M 368 46 C 330 38 265 38 220 48 L 224 60 C 265 52 330 52 358 58 Z" fill="url(#clb-brow)"/>
  <circle cx="362" cy="49" r="2" fill="url(#clb-gold)"/>

  <!-- Temples -->
  <path d="M 32 46 L 8 44 C 6 44 4 45 4 47 L 4 51 C 4 53 6 54 8 54 L 32 52 Z" fill="url(#clb-brow)"/>
  <path d="M 368 46 L 392 44 C 394 44 396 45 396 47 L 396 51 C 396 53 394 54 392 54 L 368 52 Z" fill="url(#clb-brow)"/>

  <!-- Nose Pads -->
  <ellipse cx="178" cy="74" rx="3.5" ry="6.5" fill="#fef08a"/>
  <ellipse cx="222" cy="74" rx="3.5" ry="6.5" fill="#fef08a"/>
</svg>
